<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>0001</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:ui-monospace,"Courier New",monospace}
  #v{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;filter:contrast(1.05) brightness(.96);background:#000}
  #snd{position:fixed;right:14px;bottom:12px;color:#d8cf9a;font-size:12px;letter-spacing:.2em;z-index:3;opacity:.8;cursor:pointer}
  #tag{position:fixed;left:14px;bottom:12px;color:#5a5338;font-size:11px;letter-spacing:.25em;z-index:2;opacity:.7}
</style>
</head>
<body>
<video id="v" playsinline loop muted autoplay preload="auto">
  <source src="0001.mp4" type="video/mp4">
</video>
<div id="snd">&#128263; tap for sound</div>
<div id="tag">0001</div>
<script>
  var v=document.getElementById('v'),s=document.getElementById('snd');
  v.play().catch(function(){});
  // any tap: unmute + ensure playing, then hide the hint
  function on(){ v.muted=false; v.play().catch(function(){}); s.style.display='none'; }
  s.addEventListener('click',on); document.body.addEventListener('click',on,{once:true});
</script>
</body>
</html>
